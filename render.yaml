# Blueprint for the FastAPI web service + managed Postgres.
#
# NOTE: Render Workflows are not yet supported in Blueprints. Create the
# Workflow service from the Dashboard (New > Workflow) with start command
# `python -m workflows.main`. See README.md > Render deploy.

databases:
  - name: langchain-workflows-db
    databaseName: langchain_workflows
    plan: free

services:
  - type: web
    name: code-review-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: langchain-workflows-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: REVIEW_API_KEY
        sync: false
