# Blueprint for the FastAPI web service + managed Postgres.
#
# NOTE: Render Workflows are not yet supported in Blueprints. Create the
# Workflow service from the Dashboard (New > Workflow) with start command
# `python -m workflows.main`, named to match WORKFLOW_NAME (default
# "deep-agents"). See README.md > Deploy to Render.

databases:
  - name: deepagents-db
    databaseName: deepagents
    plan: free

services:
  - type: web
    name: deepagents-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deepagents-db
          property: connectionString
      # Size the pool to your Postgres plan's connection limit, divided across
      # the web service + each Workflow instance. Free/Starter plans are small.
      - key: DB_POOL_MAX_SIZE
        value: "5"
      # Must match the name of the Workflow you create in the Dashboard.
      - key: WORKFLOW_NAME
        value: deep-agents
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: API_KEY
        sync: false
