<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div class="shell">

  <h1>{{TITLE}}</h1>
  <p class="sub">Paste a public GitHub PR link to run a multi-agent code review.</p>

  <form id="run">
    <div class="form-row">
      <input type="url" id="pr-url" placeholder="https://github.com/owner/repo/pull/123" autocomplete="url">
      <button type="submit" id="go">Review</button>
      <button type="button" id="refresh" class="secondary">Refresh</button>
    </div>
    <div class="status-line" id="submit-status"></div>
  </form>

  <table>
    <thead>
      <tr>
        <th>Agent</th>
        <th>Status</th>
        <th>Started</th>
        <th>Duration</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="4" class="muted">Loading...</td></tr>
    </tbody>
  </table>

</div>
<script>
const rows = document.getElementById('rows')
const form = document.getElementById('run')
const prUrlEl = document.getElementById('pr-url')
const go = document.getElementById('go')
const refreshBtn = document.getElementById('refresh')
const submitStatus = document.getElementById('submit-status')
let openId = null
let activeTimer = null
let loading = false
const ACTIVE_REFRESH_MS = 2000

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))

const API_KEY_STORE = 'reviewApiKey'
const authHeaders = (extra = {}) => {
  const key = localStorage.getItem(API_KEY_STORE)
  return key ? { ...extra, 'x-api-key': key } : extra
}

// Fetch wrapper that prompts for an API key on 401 and retries once,
// so an authenticated deployment stays usable without code changes.
async function apiFetch(url, options = {}, retried = false) {
  const opts = { ...options, headers: authHeaders(options.headers || {}) }
  const res = await fetch(url, opts)
  if (res.status === 401 && !retried) {
    const key = prompt('This API requires a key. Enter your API key:')
    if (key) {
      localStorage.setItem(API_KEY_STORE, key)
      return apiFetch(url, options, true)
    }
  }
  return res
}

const fmtJson = (v) => {
  if (v === null || v === undefined) return ''
  if (typeof v === 'string') return v
  try { return JSON.stringify(v, null, 2) } catch { return String(v) }
}

function statusClass(s) {
  if (s === 'completed') return 'completed'
  if (s === 'failed') return 'failed'
  return 'running'
}

function durationStr(t) {
  if (!t.completed_at) return '-'
  const ms = new Date(t.completed_at).getTime() - new Date(t.started_at).getTime()
  if (!Number.isFinite(ms) || ms < 0) return '-'
  return (ms / 1000).toFixed(1) + 's'
}

function timeStr(iso) {
  try { return new Date(iso).toLocaleTimeString() } catch { return iso }
}

function traceCells(t) {
  return '<td><code>' + esc(t.agent_name) + '</code></td>' +
    '<td><span class="pill ' + statusClass(t.status) + '">' + esc(t.status) + '</span></td>' +
    '<td>' + timeStr(t.started_at) + '</td>' +
    '<td>' + durationStr(t) + '</td>'
}

function spanBlock(s) {
  const label = esc(s.span_type) + ':' + esc(s.name)
  const dur = s.duration_ms !== null ? ' (' + s.duration_ms + 'ms)' : ''
  const parts = []
  if (s.input_data) {
    parts.push('<div class="span-io"><span class="label">input</span><pre>' +
      esc(fmtJson(s.input_data)) + '</pre></div>')
  }
  if (s.output_data) {
    parts.push('<div class="span-io"><span class="label">output</span><pre>' +
      esc(fmtJson(s.output_data)) + '</pre></div>')
  }
  if (!parts.length) parts.push('<div class="span-io muted">No data recorded.</div>')
  return '<details class="span"><summary><code>' + label + '</code>' +
    esc(dur) + '</summary>' + parts.join('') + '</details>'
}

async function toggle(id, tr, force) {
  let existing = tr.nextElementSibling
  if (existing && existing.classList.contains('detail') && !force) {
    existing.remove()
    openId = null
    return
  }
  rows.querySelectorAll('tr.detail').forEach((r) => {
    if (r !== existing) r.remove()
  })
  openId = id

  const spans = await apiFetch('/api/traces/' + id + '/spans').then(r => r.json())
  const detail = existing && existing.classList.contains('detail')
    ? existing : document.createElement('tr')
  detail.className = 'detail'

  const header = '<h4>Spans (' + spans.length + ')</h4>'
  const toggle = spans.length > 1
    ? ' <button class="link toggle-spans">expand all</button>'
    : ''
  const body = spans.length
    ? spans.map(spanBlock).join('')
    : '<span class="muted">No spans recorded.</span>'

  detail.innerHTML = '<td colspan="4">' + header + toggle + body + '</td>'
  if (!detail.parentElement) tr.after(detail)

  const toggleBtn = detail.querySelector('.toggle-spans')
  if (toggleBtn) {
    toggleBtn.onclick = () => {
      const all = [...detail.querySelectorAll('details.span')]
      const anyClosed = all.some(d => !d.open)
      all.forEach(d => { d.open = anyClosed })
      toggleBtn.textContent = anyClosed ? 'collapse all' : 'expand all'
    }
  }
}

function scheduleActiveRefresh(list) {
  if (activeTimer) clearTimeout(activeTimer)
  activeTimer = null
  if (!list.some(t => t.status === 'running')) return
  activeTimer = setTimeout(() => load({ preserveScroll: true, silent: true }), ACTIVE_REFRESH_MS)
}

async function load(opts = {}) {
  if (loading) return
  loading = true
  refreshBtn.disabled = true
  const scrollY = opts.preserveScroll ? window.scrollY : null
  try {
    const list = await apiFetch('/api/traces').then(r => r.json())
    rows.innerHTML = list.length
      ? '' : '<tr><td colspan="4" class="muted">No traces yet. Paste a PR URL above to start.</td></tr>'
    for (const t of list) {
      const tr = document.createElement('tr')
      tr.className = 'trace'
      tr.dataset.traceId = t.id
      tr.innerHTML = traceCells(t)
      tr.onclick = () => toggle(t.id, tr)
      rows.append(tr)
      if (t.id === openId) await toggle(t.id, tr, true)
    }
    scheduleActiveRefresh(list)
  } catch (err) {
    if (!opts.silent) setStatus('Could not load traces: ' + err.message, 'error')
  } finally {
    refreshBtn.disabled = false
    loading = false
    if (scrollY !== null) requestAnimationFrame(() => window.scrollTo(0, scrollY))
  }
}

function setStatus(msg, state) {
  submitStatus.textContent = msg || ''
  submitStatus.dataset.state = state || ''
}

form.onsubmit = async (e) => {
  e.preventDefault()
  const prUrl = prUrlEl.value.trim()
  if (!prUrl) { setStatus('Paste a PR URL first.', 'error'); return }
  if (!/^https?:\/\/github\.com\/.+\/pull\/\d+/.test(prUrl)) {
    setStatus('Enter a valid GitHub PR URL (e.g. https://github.com/owner/repo/pull/123).', 'error')
    return
  }
  go.disabled = true
  go.textContent = 'Fetching PR...'
  setStatus('', '')
  try {
    const res = await apiFetch('/reviews/pr', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pr_url: prUrl }),
    })
    if (!res.ok) throw new Error(await res.text())
    prUrlEl.value = ''
    setStatus('Review submitted — traces will appear below.', '')
    await load({ silent: true })
  } catch (err) {
    setStatus('Review failed: ' + err.message, 'error')
  } finally {
    go.disabled = false
    go.textContent = 'Review'
  }
}

refreshBtn.onclick = () => load()
load()
</script>
</body>
</html>
