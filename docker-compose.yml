# Local API + Postgres. Subagents run in-process unless RENDER_API_KEY is set,
# so this is enough to exercise the full pipeline locally.
#
# Set OPENAI_API_KEY or ANTHROPIC_API_KEY in your shell or a .env file first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepagents
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/deepagents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
